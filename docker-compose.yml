# FAZE local development stack.
# Every teammate runs the same MySQL so "works on my machine" is not a defense.
#
#   docker compose up -d
#   docker compose exec db mysql -uroot -proot -e "SELECT VERSION();"
#
# Adminer (http://localhost:8080) is for teammates without MySQL Workbench.
# The course uses Workbench; both connect to the same server on port 3306.

services:
  db:
    image: mysql:8.4
    container_name: faze-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # log_bin_trust_function_creators lets us create the AGENT 03 triggers
      # and procedures without SUPER on a binlog-enabled server.
      - --log_bin_trust_function_creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: faze
    ports:
      - '3306:3306'
    volumes:
      - faze_db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  adminer:
    image: adminer:4
    container_name: faze-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '8080:8080'

volumes:
  faze_db_data:
