name: Debug typecheck

on:
  push:
    branches: [alvin-phase2-all]

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alvin-phase2-all
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture typecheck
        run: npm run typecheck > typecheck.txt 2>&1 || true
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f typecheck.txt
          git commit -m "chore: capture typecheck output"
          git push origin HEAD:alvin-phase2-all
