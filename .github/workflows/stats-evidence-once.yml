name: Capture stats screenshot evidence

on:
  push:
    branches: [alvin-phase2-all]

permissions:
  contents: write

jobs:
  screenshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: faze
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alvin-phase2-all
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Configure local app
        run: |
          printf '%s\n'             'NODE_ENV=development'             'PORT=4000'             'CLIENT_ORIGIN=http://127.0.0.1:5173'             'DB_HOST=127.0.0.1'             'DB_PORT=3306'             'DB_USER=root'             'DB_PASSWORD=root'             'DB_NAME=faze'             'JWT_ACCESS_SECRET=phase2-screenshot-secret-0123456789-abcdefghijklmnopqrstuvwxyz'             'COOKIE_SECURE=false' > .env
      - run: npm run db:migrate
      - name: Make stats public only in this disposable runner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reports = Path('server/src/routes/reports.ts')
          text = reports.read_text()
          text = text.replace("  requireAuth,\n", "")
          reports.write_text(text)

          app = Path('client/src/App.tsx')
          text = app.read_text()
          old = """          <Route
            path="/stats"
            element={
              <RequireAuth>
                <Stats />
              </RequireAuth>
            }
          />"""
          new = """          <Route path="/stats" element={<Stats />} />"""
          if old not in text:
              raise SystemExit('stats route shape changed')
          app.write_text(text.replace(old, new))
          PY
      - name: Start API and website
        run: |
          npm run dev --workspace=@faze/server > /tmp/faze-server.txt 2>&1 &
          npm run dev --workspace=@faze/client -- --host 127.0.0.1 > /tmp/faze-client.txt 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null && curl -fsS http://127.0.0.1:5173/stats >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Capture page
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars             --window-size=1440,900 --virtual-time-budget=4000             --screenshot=docs/screenshots/stats.png             http://127.0.0.1:5173/stats
          test -s docs/screenshots/stats.png
      - name: Commit screenshot
        run: |
          git checkout -- server/src/routes/reports.ts client/src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/stats.png
          git commit -m "docs: add database stats screenshot"
          git push origin HEAD:alvin-phase2-all
